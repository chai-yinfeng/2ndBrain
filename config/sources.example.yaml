# 信源清单（种子）。复制为 config/sources.yaml 后按需修改。
# 所有 URL（含 YouTube 频道 RSS 的 channel_id）已于 2026-11 实测可用。
#
# 每个条目字段：
#   id:            唯一标识（小写、短横线）
#   type:          rss | arxiv | hf_papers | youtube | sitemap | html_index
#   url:           rss / hf_papers / youtube / sitemap / html_index 使用的地址
#                  （sitemap 为 sitemap.xml；html_index 为博客列表页）
#   homepage:      人实际浏览的博客列表页或频道页（/sources 上信源名的链接；2026-11 逐个实测）
#   query:         arxiv 使用的检索式（分类 + 关键词）
#   trust:         1–5，信源可信度，参与排序加权
#                  建议：个人一线博客与 infra 博客 5，实验室官方与论文 4，newsletter 3，expansion 3
#   role:          core | expansion（expansion 只进入"意外"栏候选池），默认 core
#   tags:          标签列表
#   max_age_days:  只采集该天数内发布的内容
#   enabled:       是否启用
#   backfill:      是否把 feed 中时间窗以外的历史条目放进回补池（默认 false；ADR 0004 / 0009）
#   needs_scraper: 站点没有可用 RSS，需要页面抓取支持（默认 false；M1 记录为待支持，不阻塞）
#   url_pattern:   sitemap / html_index 专用，只保留匹配该正则的 URL（排除列表页、About 等；
#                  html_index 中匹配的是转成绝对地址后的文章链接，必填）
#   max_links:     html_index 专用，列表页最多取前 N 个文章链接（可选；ADR 0020）
#   use_lastmod:   sitemap 专用，URL 中没有日期时按 <lastmod> 选最新条目，入库时页面日期优先
#                  （默认 false；ADR 0012）

sources:
  # ---------- core / 推理 infra ----------
  - id: vllm-blog
    type: rss
    url: https://vllm.ai/blog/rss.xml
    homepage: https://vllm.ai/blog
    trust: 5
    role: core
    tags: [inference, serving]
    max_age_days: 30
    enabled: true

  - id: lmsys-sglang-blog
    type: sitemap
    url: https://lmsys.org/sitemap.xml
    homepage: https://lmsys.org/blog/
    url_pattern: '^https://www\.lmsys\.org/blog/\d{4}-\d{2}-\d{2}-'  # 发布日期在 slug 里
    trust: 5
    role: core
    tags: [inference, serving, sglang]
    max_age_days: 30
    enabled: true

  - id: sglang-blog
    type: html_index
    # sglang.io 与 lmsys.org 是两个都在更新的 SGLang 博客；sglang.io 的 sitemap 只列了 3 篇，
    # 所以直接解析列表页（html_index，ADR 0020）
    url: https://www.sglang.io/blog
    homepage: https://www.sglang.io/blog
    url_pattern: '^https://www\.sglang\.io/blog/[^/?#]+$'
    trust: 5
    role: core
    tags: [inference, serving, sglang]
    max_age_days: 30
    enabled: true

