# 信源清单（种子）。复制为 config/sources.yaml 后按需修改。
# 所有 URL（含 YouTube 频道 RSS 的 channel_id）已于 2026-11 实测可用。
#
# 每个条目字段：
#   id:            唯一标识（小写、短横线）
#   type:          rss | arxiv | hf_papers | youtube
#   url:           rss / hf_papers / youtube 使用的地址
#   query:         arxiv 使用的检索式（分类 + 关键词）
#   trust:         1–5，信源可信度，参与排序加权
#                  建议：个人一线博客与 infra 博客 5，实验室官方与论文 4，newsletter 3，expansion 3
#   role:          core | expansion（expansion 只进入"意外"栏候选池），默认 core
#   tags:          标签列表
#   max_age_days:  只采集该天数内发布的内容
#   enabled:       是否启用
#   backfill:      是否把 feed 中时间窗以外的历史条目放进回补池（默认 false；ADR 0004 / 0009）
#   needs_scraper: 站点没有可用 RSS，需要页面抓取支持（默认 false；M1 记录为待支持，不阻塞）

sources:
