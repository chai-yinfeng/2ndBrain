{% set s = source|default(none) %}
<div class="source-fields">
  <label>显示名称<input name="name" maxlength="200" value="{{ s.name or '' if s else '' }}" placeholder="例如 Google DeepMind"></label>
  <label>标识 ID<input name="id" required pattern="[a-z0-9][a-z0-9-]*" value="{{ s.id if s else '' }}" placeholder="my-blog"></label>
  <label>主页<input name="homepage" type="url" value="{{ s.homepage or '' if s else '' }}"></label>
  <label>采集地址<input name="url" type="url" value="{{ s.url or '' if s else '' }}" placeholder="RSS / API / 列表 / sitemap 地址"></label>
  <label>获取方式<select name="type">{% for t in types %}<option value="{{ t }}"{% if s and s.type == t %} selected{% endif %}>{{ t }}</option>{% endfor %}</select></label>
  <label>arXiv 查询<input name="query" value="{{ s.query or '' if s else '' }}" placeholder="仅 arxiv 使用"></label>
  <label class="wide">手动标签<input name="tags" value="{{ s.tags|join(', ') if s else '' }}" placeholder="逗号分隔；AI 不会覆盖"></label>
  <label>信任度<input name="trust" type="number" min="1" max="5" value="{{ s.trust if s else 3 }}"></label>
  <label>推荐角色<select name="role">{% for role in ['core','expansion'] %}<option value="{{ role }}"{% if s and s.role == role %} selected{% endif %}>{{ role }}</option>{% endfor %}</select></label>
  <label>时间窗（天）<input name="max_age_days" type="number" min="1" value="{{ s.max_age_days if s else 30 }}"></label>
  <label>列表最多链接<input name="max_links" type="number" min="1" value="{{ s.max_links or '' if s else '' }}" placeholder="仅 html_index 使用"></label>
  <label class="wide">文章地址匹配规则<input name="url_pattern" value="{{ s.url_pattern or '' if s else '' }}" placeholder="sitemap / html_index；html_index 必填"></label>
</div>
<div class="source-options">
  <label><input name="use_lastmod" type="checkbox" value="1"{% if s and s.use_lastmod %} checked{% endif %}> sitemap 使用 lastmod 日期</label>
  {% if s %}<label><input name="enabled" type="checkbox" value="1"{% if s.enabled %} checked{% endif %}> 启用</label><label><input name="needs_scraper" type="checkbox" value="1"{% if s.needs_scraper %} checked{% endif %}> 仅保存主页，手动浏览</label>{% endif %}
</div>
{% if s %}<p class="help">修改 ID 会同步迁移材料来源和历史引用；只想改列表名称时，修改显示名称即可。未展示的个人配置保持不变。</p>{% endif %}
