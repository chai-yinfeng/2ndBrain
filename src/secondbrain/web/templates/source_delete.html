{% extends "base.html" %}
{% block title %}删除信源 · Second Brain{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">信源管理</p><h1>删除信源 {{ source_id }}？</h1></div></header>
<section class="panel form-panel">
<p>将从 <span class="break-anywhere">{{ path }}</span> 中删除该信源（只删除这一条的文本块，其余内容与注释保留）。已入库的条目、反馈与 digest 都会保留。</p>
<form method="post" action="/sources/{{ source_id }}/delete" class="toolbar">
  <input type="hidden" name="confirm" value="yes">
  <button type="submit" class="fb">确认删除</button>
  <a class="fb" href="/sources">取消</a>
</form>
</section>
{% endblock %}
