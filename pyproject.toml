[project]
name = "secondbrain"
version = "0.1.0"
description = "个人知识过滤 + 分级推荐 + 知识 wiki"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "httpx",
    "pyyaml",
    "pydantic",
    "feedparser>=6.0.14",
    "trafilatura>=2.3.1",
    "pypdf>=6.21.4",
    "openai>=3.45.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.10.26",
    "markdown>=3.11.2",
]

[project.scripts]
sb = "secondbrain.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: 需要网络或真实 LLM 的测试，默认跳过（用 -m live 运行）",
]
